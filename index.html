<script>

// ═══════════════════════════════════════
// FIREBASE REAL-TIME SYNC ENGINE
// ═══════════════════════════════════════
var FB_DB=null,FB_REF=null,FB_LISTENING=false,FB_WRITING=false;
var FB_WRITE_TIMER=null,FB_LAST_TS=0,FB_READY=false;
var FB_CONFIG_KEY='ct:fb:config';
var SYNC_TIMER=null;

function fbGetSavedConfig(){try{var c=localStorage.getItem(FB_CONFIG_KEY);return c?JSON.parse(c):null;}catch(e){return null;}}
function fbSaveConfigToStorage(cfg){try{localStorage.setItem(FB_CONFIG_KEY,JSON.stringify(cfg));}catch(e){}}

function fbSaveConfig(){
  var url=(document.getElementById('fb-input-url')||{value:''}).value.trim();
  var key=(document.getElementById('fb-input-key')||{value:''}).value.trim();
  var pid=(document.getElementById('fb-input-pid')||{value:''}).value.trim();
  if(!url||!key||!pid){toast('⚠️ Điền đủ 3 trường bắt buộc');return;}
  if(!url.includes('firebasedatabase.app')){toast('⚠️ Database URL chưa đúng định dạng');return;}
  var cfg={databaseURL:url,apiKey:key,projectId:pid,authDomain:pid+'.firebaseapp.com'};
  fbSaveConfigToStorage(cfg);
  document.getElementById('fb-setup').style.display='none';
  fbInit(cfg);
}
function fbSkip(){document.getElementById('fb-setup').style.display='none';toast('📱 Chạy offline — chỉ lưu trong trình duyệt này');}
function fbShowSetup(){document.getElementById('fb-setup').style.display='flex';}

function fbInit(cfg){
  if(!cfg||!cfg.databaseURL||!cfg.apiKey)return;
  var s1=document.createElement('script');
  s1.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
  s1.onload=function(){
    var s2=document.createElement('script');
    s2.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js';
    s2.onload=function(){
      try{
        var app;try{app=firebase.app();}catch(e){app=firebase.initializeApp(cfg);}
        FB_DB=firebase.database(app);FB_REF=FB_DB.ref('chia-tien/data');
        FB_READY=true;fbStartListening();showSyncBar('🔥 Firebase đã kết nối',2500);render();
      }catch(e){toast('⚠️ Firebase lỗi: '+e.message);}
    };document.head.appendChild(s2);
  };document.head.appendChild(s1);
}

function fbStartListening(){
  if(!FB_REF||FB_LISTENING)return;FB_LISTENING=true;
  FB_REF.on('value',function(snapshot){
    if(FB_WRITING)return;
    var val=snapshot.val();if(!val)return;
    var remoteTs=val._ts||0;if(remoteTs<=FB_LAST_TS)return;
    D.people=val.people||[];D.bills=val.bills||[];D.settlements=val.settlements||[];
    saveLocalOnly();render();showSyncBar('⚡ Đồng bộ từ người khác',1800);
  });
}

function fbWrite(){
  if(!FB_READY||!FB_REF)return;
  clearTimeout(FB_WRITE_TIMER);
  FB_WRITE_TIMER=setTimeout(function(){
    FB_WRITING=true;FB_LAST_TS=Date.now();
    var payload={people:D.people,bills:D.bills,settlements:D.settlements,_ts:FB_LAST_TS};
    FB_REF.set(payload).then(function(){
      setTimeout(function(){FB_WRITING=false;},300);
      showSyncBar('✅ Đã đồng bộ lên cloud',1500);
    }).catch(function(e){FB_WRITING=false;toast('⚠️ Lỗi sync: '+e.message);});
  },400);
}

function showSyncBar(msg,dur){
  var bar=document.getElementById('sync-bar');
  if(!bar)return;bar.textContent=msg;bar.classList.add('show');
  clearTimeout(SYNC_TIMER);SYNC_TIMER=setTimeout(function(){bar.classList.remove('show');},dur||2000);
}
// ═══════════════════════════════════════

var KEY='ct:v10', DK=KEY+':draft';
var D={people:[],bills:[],settlements:[]};
var TAB='group', HTAB='bills';
var BF={date:'',desc:'',parts:[],items:[]};
var SF={date:'',from:'',to:'',amt:'',note:''};
var EP=null;
var EXPANDED_DEBT=null;
var TT;
var FILE_HANDLE=null;
var DB_NAME='ct-file-handle-db', DB_STORE='handles', DB_KEY='main-html';

function idbOpen(){
  return new Promise(function(resolve,reject){
    if(!('indexedDB' in window)){reject(new Error('No IndexedDB'));return;}
    var req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=function(){req.result.createObjectStore(DB_STORE);};
    req.onsuccess=function(){resolve(req.result);};
    req.onerror=function(){reject(req.error);};
  });
}
function idbSet(k,v){
  return idbOpen().then(function(db){return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(v,k);
    tx.oncomplete=function(){db.close();resolve();};tx.onerror=function(){db.close();reject(tx.error);};
  });});
}
function idbGet(k){
  return idbOpen().then(function(db){return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readonly');var req=tx.objectStore(DB_STORE).get(k);
    req.onsuccess=function(){var v=req.result;db.close();resolve(v);};
    req.onerror=function(){db.close();reject(req.error);};
  });});
}
function idbDel(k){
  return idbOpen().then(function(db){return new Promise(function(resolve,reject){
    var tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(k);
    tx.oncomplete=function(){db.close();resolve();};tx.onerror=function(){db.close();reject(tx.error);};
  });});
}
function loadSavedHandle(){
  if(!supportsFS())return;
  idbGet(DB_KEY).then(function(h){if(h){FILE_HANDLE=h;toast('🔗 Đã nhớ file lưu trực tiếp');}}).catch(function(){});
}
function resetFileLink(){
  FILE_HANDLE=null;
  idbDel(DB_KEY).then(function(){toast('Đã bỏ liên kết file');}).catch(function(){toast('Đã bỏ liên kết file');});
}
function linkCurrentFile(){
  if(!supportsFS()||typeof window.showOpenFilePicker!=='function'){
    toast('⚠️ Trình duyệt không hỗ trợ liên kết file');return;
  }
  window.showOpenFilePicker({
    multiple:false,
    types:[{description:'HTML',accept:{'text/html':['.html']}}]
  }).then(function(handles){
    if(!handles||!handles.length)return;
    FILE_HANDLE=handles[0];
    return idbSet(DB_KEY,FILE_HANDLE).then(function(){toast('🔗 Đã liên kết file. Từ lần sau bấm Lưu sẽ ghi đè trực tiếp.');});
  }).catch(function(err){
    if(err&&err.name==='AbortError'){toast('Đã hủy liên kết');return;}
    toast('⚠️ Không liên kết được file');
  });
}

// ── Utils ────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function vnd(n){return Math.round(Number(n)||0).toLocaleString('vi-VN')+'₫';}
function h(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function gn(id){var p=D.people.find(function(x){return x.id===id;});return p?p.name:'?';}
function iso(){var d=new Date();var m=d.getMonth()+1;var dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function fd(s){if(!s)return'';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function act(){return D.people.filter(function(p){return p.status==='active';});}

// ── Storage ──────────────────────────────
function loadInit(){
  // Ưu tiên dữ liệu đã lưu trong trình duyệt để lần sau mở app không bị quay về dữ liệu nhúng trong file HTML.
  // File HTML chỉ đóng vai trò bản app/backup; dữ liệu làm việc được auto-save vào localStorage.
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var d=JSON.parse(r);
      if(d){D.people=d.people||[];D.bills=d.bills||[];D.settlements=d.settlements||[];return true;}
    }
  }catch(e){}
  try{
    var sc=document.getElementById('initial-data');
    if(sc){
      var c=sc.textContent.replace(/<\/script/gi,'</script').trim();
      if(c&&c!=='{}'){
        var data=JSON.parse(c);
        if(data){D.people=data.people||[];D.bills=data.bills||[];D.settlements=data.settlements||[];saveD();return true;}
      }
    }
  }catch(e){}
  return false;
}
function saveLocalOnly(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
function saveD(){saveLocalOnly();fbWrite();}
function saveDraft(){try{localStorage.setItem(DK,JSON.stringify(BF));}catch(e){}}
function loadDraft(){try{var r=localStorage.getItem(DK);if(r)BF=JSON.parse(r);}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DK);}catch(e){}}
function hasDraft(){try{return!!localStorage.getItem(DK);}catch(e){return false;}}

// ── Toast ────────────────────────────────
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(TT);TT=setTimeout(function(){e.style.display='none';},2500);}

// ── Build HTML for save/share ────────────
function buildHtml(){
  var rootEl=document.getElementById('root'),toastEl=document.getElementById('toast');
  var rootBak=rootEl.innerHTML,toastBak=toastEl.innerHTML,toastDisp=toastEl.style.display;
  rootEl.innerHTML='';toastEl.innerHTML='';toastEl.style.display='none';
  var sc=document.getElementById('initial-data');
  var oldText=sc.textContent;
  var newData=JSON.stringify({people:D.people,bills:D.bills,settlements:D.settlements}).replace(/<\/script/gi,'<\\/script');
  sc.textContent=newData;
  var out='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  sc.textContent=oldText;
  rootEl.innerHTML=rootBak;toastEl.innerHTML=toastBak;toastEl.style.display=toastDisp;
  return out;
}

function supportsFS(){return typeof window.showSaveFilePicker==='function';}

// Tải file mới về máy (luôn tạo bản tải xuống)
function downloadFile(){
  try{
    var html=buildHtml();
    var blob=new Blob([html],{type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download='chia-tien-'+iso()+'.html';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);if(a.parentNode)a.parentNode.removeChild(a);},1500);
    toast('⬇️ Đã tải file về máy');
  }catch(e){toast('⚠️ Không tải được');}
}

// Lưu: ghi đè trực tiếp lên file nếu trình duyệt hỗ trợ, không thì tải về
function saveFile(){
  // Lưu chính: ghi vào bộ nhớ trình duyệt ngay lập tức. Cách này không cần Link lại sau mỗi lần mở.
  saveD();
  if(FILE_HANDLE && supportsFS()){
    saveToHandle();
    return;
  }
  toast('💾 Đã lưu trong trình duyệt. Dùng ⬇️ Tải nếu cần xuất file backup.');
}

function saveToHandle(){
  var run=function(){
    try{
      var html=buildHtml();
      var blob=new Blob([html],{type:'text/html;charset=utf-8'});
      FILE_HANDLE.createWritable().then(function(w){
        return w.write(blob).then(function(){return w.close();});
      }).then(function(){
        toast('💾 Đã lưu trực tiếp vào file');
      }).catch(function(e){
        // Mất quyền hoặc lỗi ghi → quay về tải file
        FILE_HANDLE=null;
        idbDel(DB_KEY).catch(function(){});
        toast('⚠️ Không ghi được — cần liên kết lại file');
      });
    }catch(e){FILE_HANDLE=null;idbDel(DB_KEY).catch(function(){});toast('⚠️ Không ghi được — cần liên kết lại file');}
  };

  if(FILE_HANDLE){
    // Đã có quyền ghi từ trước → kiểm tra lại quyền rồi ghi
    if(FILE_HANDLE.queryPermission){
      FILE_HANDLE.queryPermission({mode:'readwrite'}).then(function(p){
        if(p==='granted'){run();}
        else if(FILE_HANDLE.requestPermission){
          FILE_HANDLE.requestPermission({mode:'readwrite'}).then(function(p2){
            if(p2==='granted')run();else pickAndSave();
          });
        }else{run();}
      }).catch(function(){run();});
    }else{run();}
    return;
  }
  pickAndSave();
}

function pickAndSave(){
  // Lần đầu cần người dùng CHỌN ĐÚNG FILE HTML hiện tại để cấp quyền ghi đè.
  // Trình duyệt không cho app tự biết đường dẫn file đang mở vì lý do bảo mật.
  if(typeof window.showOpenFilePicker==='function'){
    toast('🔗 Lần đầu hãy chọn đúng file app đang dùng');
    window.showOpenFilePicker({
      multiple:false,
      types:[{description:'HTML',accept:{'text/html':['.html']}}]
    }).then(function(handles){
      if(!handles||!handles.length)return;
      FILE_HANDLE=handles[0];
      return idbSet(DB_KEY,FILE_HANDLE).then(function(){saveToHandle();});
    }).catch(function(err){
      if(err&&err.name==='AbortError'){toast('Đã hủy lưu');return;}
      toast('⚠️ Không chọn được file — đang tải bản mới');
      downloadFile();
    });
    return;
  }
  downloadFile();
}

function shareFile(){
  try{
    var html=buildHtml();
    var fname='chia-tien-'+iso()+'.html';
    if(typeof File!=='undefined'&&navigator.share&&navigator.canShare){
      try{
        var file=new File([html],fname,{type:'text/html'});
        if(navigator.canShare({files:[file]})){
          navigator.share({title:'Chia Tiền Nhóm',text:'File chia tiền — mở bằng trình duyệt',files:[file]})
            .then(function(){toast('✅ Đã chia sẻ');})
            .catch(function(err){if(err&&err.name!=='AbortError')saveFile();});
          return;
        }
      }catch(e){}
    }
    saveFile();
    toast('📤 Tải xong — gửi qua Zalo/Email');
  }catch(e){toast('⚠️ Không chia sẻ được');}
}

// ── Balance ──────────────────────────────
function calcBal(){
  var b={};D.people.forEach(function(p){b[p.id]=0;});
  D.bills.forEach(function(bill){
    bill.parts.forEach(function(p){if(!(p.id in b))b[p.id]=0;b[p.id]+=(p.paid||0)-(p.share||0);});
  });
  D.settlements.forEach(function(s){
    if(!(s.from in b))b[s.from]=0;if(!(s.to in b))b[s.to]=0;
    b[s.from]+=s.amt;b[s.to]-=s.amt;
  });
  return b;
}

function buildParts(parts,items,total){
  var n=parts.length;if(!n||!total)return[];
  var base=Math.floor(total/n),rem=Math.round(total-base*n);
  // Track participant pays
  var pSet={};parts.forEach(function(id){pSet[id]=true;});
  var paid={};parts.forEach(function(id){paid[id]=0;});
  // Track EXTERNAL payers (trả tiền nhưng không tham gia bữa)
  var extPaid={};
  items.forEach(function(it){
    var a=parseFloat(it.amt)||0;if(!a||!it.payer)return;
    if(it.payer in pSet) paid[it.payer]+=a;
    else extPaid[it.payer]=(extPaid[it.payer]||0)+a;
  });
  // Participants với share
  var result=parts.map(function(id,i){
    return{id:id,share:i===0?base+rem:base,paid:paid[id]||0};
  });
  // External payers: share=0, paid=khoản đã trả → net dương = được nhận lại
  Object.keys(extPaid).forEach(function(id){
    result.push({id:id,share:0,paid:extPaid[id]});
  });
  return result;
}

// ── Live update ─────────────────────────
function liveUpdate(){
  readBF();
  var total=BF.items.reduce(function(s,x){return s+(parseFloat(x.amt)||0);},0);
  var n=BF.parts.length;
  var tEl=document.getElementById('bf-total');
  if(tEl){
    var shareStr=n>0&&total>0?' <span style="font-size:12px;color:#6B7280;font-weight:500">÷'+n+' = <b style="color:#7B2FBE">'+vnd(total/n)+'</b>/người</span>':'';
    tEl.innerHTML='<span style="font-weight:900;font-size:22px;color:#7B2FBE">'+vnd(total)+'</span>'+shareStr;
  }
  var pv=document.getElementById('bf-pv'),pb=document.getElementById('bf-pb');
  if(!pv||!pb)return;
  if(!total||!n){pv.style.display='none';return;}
  pv.style.display='block';
  var base=Math.floor(total/n),rem=Math.round(total-base*n);
  // Track participant vs external payers
  var pSet={};BF.parts.forEach(function(id){pSet[id]=true;});
  var paid={};BF.parts.forEach(function(id){paid[id]=0;});
  var extPaid={};
  BF.items.forEach(function(it){
    var a=parseFloat(it.amt)||0;if(!a||!it.payer)return;
    if(it.payer in pSet)paid[it.payer]+=a;
    else extPaid[it.payer]=(extPaid[it.payer]||0)+a;
  });
  function pvRow(id,share,p){
    var net=p-share;
    var row='<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #F3F4F6;font-size:12.5px">';
    row+='<span style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h(gn(id))+'</span>';
    row+='<span style="color:#6B7280;text-align:right;white-space:nowrap">'+vnd(share)+'</span>';
    row+='<span style="color:#7B2FBE;text-align:right;white-space:nowrap;font-weight:600">'+(p>0?vnd(p):'—')+'</span>';
    if(net>0.5)row+='<span style="color:#10B981;font-weight:800;white-space:nowrap">+'+vnd(net)+'</span>';
    else if(net<-0.5)row+='<span style="color:#EF4444;font-weight:800;white-space:nowrap">-'+vnd(-net)+'</span>';
    else row+='<span style="color:#94A3B8;white-space:nowrap">0₫</span>';
    return row+'</div>';
  }
  var html='';
  BF.parts.forEach(function(id,i){html+=pvRow(id,i===0?base+rem:base,paid[id]||0);});
  // External payers: trả tiền nhưng không ăn → share=0, net=+paid
  Object.keys(extPaid).forEach(function(id){
    html+='<div style="display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #F3F4F6;font-size:12.5px">';
    html+='<span style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+h(gn(id))+' <span style="font-size:9px;background:#EDE9FE;color:#7B2FBE;padding:1px 5px;border-radius:4px">Trả hộ</span></span>';
    html+='<span style="color:#6B7280;text-align:right;white-space:nowrap">—</span>';
    html+='<span style="color:#7B2FBE;text-align:right;white-space:nowrap;font-weight:600">'+vnd(extPaid[id])+'</span>';
    html+='<span style="color:#10B981;font-weight:800;white-space:nowrap">+'+vnd(extPaid[id])+'</span>';
    html+='</div>';
  });
  pb.innerHTML=html;
  saveDraft();
}

function saveSettle(){
  var f=document.getElementById('sf-f'),t=document.getElementById('sf-t'),a=document.getElementById('sf-a'),n=document.getElementById('sf-n'),d=document.getElementById('sf-d');
  SF.from=f?f.value:'';SF.to=t?t.value:'';SF.amt=a?a.value:'';SF.note=n?n.value.trim():'';SF.date=d?d.value:'';
  var amt=parseFloat(SF.amt);
  if(!SF.from||!SF.to){toast('⚠️ Chọn người trả và nhận');return;}
  if(SF.from===SF.to){toast('⚠️ Không được trùng người');return;}
  if(!amt||amt<=0){toast('⚠️ Nhập số tiền hợp lệ');return;}

  // Chỉ cho ghi nhận đúng khoản đang còn nợ trực tiếp của cặp from → to.
  // Không dùng số dư NET, vì sẽ làm giảm nhầm khoản nợ của người nhận với người khác.
  var pair=calcPairwise();
  var maxAmt=Math.round(((pair[SF.from]||{})[SF.to])||0);
  if(maxAmt<=0){toast('⚠️ Cặp này không còn công nợ trực tiếp');return;}
  if(Math.round(amt)>maxAmt){
    SF.amt=String(maxAmt);
    toast('⚠️ Số tiền vượt công nợ trực tiếp. Đã tự đưa về '+vnd(maxAmt));
    render();
    return;
  }

  D.settlements.push({id:uid(),date:SF.date,from:SF.from,to:SF.to,amt:amt,note:SF.note,ts:Date.now()});
  saveD();initSF();toast('✅ Đã ghi nhận!');TAB='debt';render();
}

// Tính công nợ THEO TỪNG HÓA ĐƠN, không cấn trừ chéo giữa các hóa đơn
// Mục tiêu: người trả hộ khoản nào thì được nhận đúng khoản đó.
// Ví dụ: Phương trả tiền nước cho Dung/Mai thì Dung/Mai phải trả Phương,
// không được lấy khoản Phương đang nợ Liên ở hóa đơn khác để cấn trừ thay.
function calcPairwiseBase(){
  var pair={};
  D.people.forEach(function(p){pair[p.id]={};});

  D.bills.forEach(function(bill){
    var debtors=[],creditors=[];
    (bill.parts||[]).forEach(function(p){
      var net=(p.paid||0)-(p.share||0);
      if(net<-0.5)debtors.push({id:p.id,amt:-net});
      else if(net>0.5)creditors.push({id:p.id,amt:net});
    });

    // Ghép nội bộ trong chính hóa đơn đó, không mang sang hóa đơn khác.
    debtors.sort(function(a,b){return b.amt-a.amt;});
    creditors.sort(function(a,b){return b.amt-a.amt;});
    var di=0,ci=0;
    while(di<debtors.length&&ci<creditors.length){
      var pay=Math.min(debtors[di].amt,creditors[ci].amt);
      var from=debtors[di].id,to=creditors[ci].id;
      if(!pair[from])pair[from]={};
      pair[from][to]=(pair[from][to]||0)+pay;
      debtors[di].amt-=pay;
      creditors[ci].amt-=pay;
      if(debtors[di].amt<0.5)di++;
      if(creditors[ci].amt<0.5)ci++;
    }
  });
  return pair;
}


// Cấn trừ chéo theo từng cặp người sau khi đã tính công nợ gốc.
// Ví dụ: A nợ B 200k và B nợ A 80k => cấn trừ 80k, A còn nợ B 120k.
function clonePair(pair){
  var out={};
  Object.keys(pair||{}).forEach(function(f){
    out[f]={};
    Object.keys(pair[f]||{}).forEach(function(t){out[f][t]=Number(pair[f][t])||0;});
  });
  D.people.forEach(function(p){if(!out[p.id])out[p.id]={};});
  return out;
}

function applyCrossOffset(pair){
  var out=clonePair(pair);
  var logs=[];
  var ids=Object.keys(out);
  for(var i=0;i<ids.length;i++){
    for(var j=i+1;j<ids.length;j++){
      var a=ids[i],b=ids[j];
      var ab=Number((out[a]||{})[b])||0;
      var ba=Number((out[b]||{})[a])||0;
      if(ab>0.5&&ba>0.5){
        var cut=Math.min(ab,ba);
        out[a][b]=ab-cut;
        out[b][a]=ba-cut;
        if(out[a][b]<0.5)delete out[a][b];
        if(out[b][a]<0.5)delete out[b][a];
        logs.push({a:a,b:b,amt:Math.round(cut),beforeAB:Math.round(ab),beforeBA:Math.round(ba),afterAB:Math.round(out[a][b]||0),afterBA:Math.round(out[b][a]||0)});
      }
    }
  }
  return {pair:out,logs:logs};
}

function calcOffsetLogs(){
  var base=calcPairwiseBase();
  D.settlements.forEach(function(s){reducePair(base,s.from,s.to,s.amt);});
  return applyCrossOffset(base).logs;
}

function reducePair(pair,from,to,amt){
  amt=Number(amt)||0;
  if(!amt||amt<=0)return;
  if(!pair[from])pair[from]={};
  if(!pair[to])pair[to]={};

  var direct=pair[from][to]||0;
  var cut=Math.min(direct,amt);
  if(cut>0){
    pair[from][to]=direct-cut;
    if(pair[from][to]<0.5)delete pair[from][to];
    amt-=cut;
  }

  // Nếu trả vượt khoản đang nợ, ghi nhận như khoản ngược lại.
  if(amt>0.5){
    pair[to][from]=(pair[to][from]||0)+amt;
  }
}

function calcPairwise(){
  var pair=calcPairwiseBase();
  D.settlements.forEach(function(s){
    reducePair(pair,s.from,s.to,s.amt);
  });
  return applyCrossOffset(pair).pair;
}

function pairOut(pair,id){
  var x=pair[id]||{},sum=0;
  Object.keys(x).forEach(function(to){sum+=Number(x[to])||0;});
  return sum;
}
function pairIn(pair,id){
  var sum=0;
  Object.keys(pair).forEach(function(from){sum+=Number((pair[from]||{})[id])||0;});
  return sum;
}

// Danh sách trả nợ dùng cho dropdown: lấy theo công nợ gốc từng hóa đơn
function calcSettlements(){
  var pair=calcPairwise();
  var ss=[];
  Object.keys(pair).forEach(function(from){
    Object.keys(pair[from]||{}).forEach(function(to){
      var amt=Math.round(pair[from][to]||0);
      if(amt>0)ss.push({from:from,to:to,amt:amt});
    });
  });
  ss.sort(function(a,b){
    if(a.from===b.from)return b.amt-a.amt;
    return gn(a.from).localeCompare(gn(b.from),'vi');
  });
  return ss;
}

function setPayTo(id){
  SF.to=id;

    if(ss[i].from===SF.from&&ss[i].to===id){SF.amt=String(ss[i].amt);break;}
  }
  render();
}

}

// ── PAGE: CÔNG NỢ ─────────────────────
function pgDebt(bal){
  var ppl=D.people;
  var pair=calcPairwise();
  if(!ppl.length)return'<div style="text-align:center;padding:50px;color:#94A3B8"><div style="font-size:48px">👥</div><div style="font-weight:700;margin-top:8px">Chưa có thành viên</div></div>';

  var debt=ppl.filter(function(p){return pairOut(pair,p.id)>0.5;}).sort(function(a,b){return pairOut(pair,b.id)-pairOut(pair,a.id);});
  var cred=ppl.filter(function(p){return pairIn(pair,p.id)>0.5;}).sort(function(a,b){return pairIn(pair,b.id)-pairIn(pair,a.id);});
  var even=ppl.filter(function(p){return pairOut(pair,p.id)<=0.5&&pairIn(pair,p.id)<=0.5;});

  if(!debt.length&&!cred.length)return'<div style="text-align:center;padding:50px;background:white;border-radius:16px;box-shadow:0 1px 3px rgba(123,47,190,.04),0 4px 16px rgba(123,47,190,.06)"><div style="font-size:56px">🎉</div><div style="font-weight:800;font-size:18px;color:#1A1A2E;margin-top:12px">Huề cả làng!</div><div style="font-size:13px;color:#94A3B8;margin-top:4px">Tất cả đã cân bằng</div></div>';

  var logs=calcOffsetLogs();
  var out='<div style="font-size:12px;color:#6B7280;margin-bottom:10px;padding:9px 11px;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px">💡 Đã bật cấn trừ chéo theo từng cặp người: nếu A nợ B và B cũng nợ A, app tự triệt tiêu phần nhỏ hơn và chỉ giữ số còn phải trả.</div>';
  if(logs.length){
    out+='<div class="card" style="border:1.5px solid #EDE9FE"><div class="ct" style="color:#7B2FBE">🔁 Log cấn trừ chéo</div>';
    logs.forEach(function(l){
      var left=gn(l.a)+' → '+gn(l.b)+' '+vnd(l.beforeAB);
      var right=gn(l.b)+' → '+gn(l.a)+' '+vnd(l.beforeBA);
      var after='Sau cấn trừ: ';
      if(l.afterAB>0)after+=gn(l.a)+' còn nợ '+gn(l.b)+' '+vnd(l.afterAB);
      else if(l.afterBA>0)after+=gn(l.b)+' còn nợ '+gn(l.a)+' '+vnd(l.afterBA);
      else after+='hai bên cân bằng';
      out+='<div style="padding:9px 0;border-bottom:1px solid #F3F4F6">';
      out+='<div style="font-size:12.5px;font-weight:800;color:#1A1A2E">Cấn trừ '+vnd(l.amt)+'</div>';
      out+='<div style="font-size:11.5px;color:#6B7280;margin-top:2px">'+h(left)+' ↔ '+h(right)+'</div>';
      out+='<div style="font-size:11.5px;color:#10B981;font-weight:700;margin-top:2px">'+h(after)+'</div>';
      out+='</div>';
    });
    out+='</div>';
  }

  function personRow(p,isDebtor,bg,clr,amount){
    var key=(isDebtor?'D-':'C-')+p.id;
    var isExp=EXPANDED_DEBT===key;

    out+='<div onclick="toggleDebt(\''+key+'\')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:'+(isExp?'none':'1px solid #F3F4F6')+'">';
    out+='<div style="display:flex;align-items:center;gap:11px">';
    out+='<div style="width:38px;height:38px;border-radius:19px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:'+clr+';flex-shrink:0">'+h(p.name[0].toUpperCase())+'</div>';
    out+='<div><div style="font-weight:700">'+h(p.name)+'</div>';
    out+='<div style="font-size:11px;color:#94A3B8;margin-top:1px">'+(isExp?'Thu gọn ▲':'Xem chi tiết ▼')+'</div></div>';
    out+='</div>';
    out+='<div>'+(isDebtor?'<span style="color:#EF4444;font-weight:800">nợ '+vnd(amount)+'</span>':'<span style="color:#10B981;font-weight:800">nhận '+vnd(amount)+'</span>')+'</div></div>';

    if(isExp){
      out+='<div style="background:#F9FAFB;border-radius:10px;padding:10px 14px;margin:4px 0 10px;border:1px solid #E5E7EB">';
      if(isDebtor){
        var entries=Object.keys(pair[p.id]||{}).filter(function(to){return Math.round(pair[p.id][to])>0;});
        if(!entries.length){
          out+='<div style="font-size:12.5px;color:#94A3B8;text-align:center;padding:4px">Không còn khoản phải trả</div>';
        }else{
          out+='<div style="font-size:11px;color:#94A3B8;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">'+h(p.name)+' cần trả:</div>';
          entries.sort(function(a,b){return pair[p.id][b]-pair[p.id][a];});
          entries.forEach(function(to){
            var amt=Math.round(pair[p.id][to]);
            out+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F3F4F6">';
            out+='<div style="display:flex;align-items:center;gap:7px"><span style="font-size:16px">→</span><div><div style="font-weight:700;font-size:13px">'+h(gn(to))+'</div></div></div>';
            out+='<span style="font-weight:800;font-size:14px;color:#EF4444">'+vnd(amt)+'</span></div>';
          });
          out+='<div style="display:flex;justify-content:space-between;padding-top:8px;font-size:12.5px"><span style="color:#6B7280">Tổng phải trả</span><span style="font-weight:800;color:#EF4444">'+vnd(pairOut(pair,p.id))+'</span></div>';
        }
      }else{
        var owers=Object.keys(pair).filter(function(from){return pair[from][p.id]&&Math.round(pair[from][p.id])>0;});
        if(!owers.length){
          out+='<div style="font-size:12.5px;color:#94A3B8;text-align:center;padding:4px">Chưa có ai phải trả</div>';
        }else{
          out+='<div style="font-size:11px;color:#94A3B8;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">'+h(p.name)+' cần thu từ:</div>';
          owers.sort(function(a,b){return (pair[b][p.id]||0)-(pair[a][p.id]||0);});
          owers.forEach(function(from){
            var amt=Math.round(pair[from][p.id]);
            out+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F3F4F6">';
            out+='<div style="display:flex;align-items:center;gap:7px"><span style="font-size:16px">←</span><div><div style="font-weight:700;font-size:13px">'+h(gn(from))+'</div></div></div>';
            out+='<span style="font-weight:800;font-size:14px;color:#10B981">'+vnd(amt)+'</span></div>';
          });
          out+='<div style="display:flex;justify-content:space-between;padding-top:8px;font-size:12.5px"><span style="color:#6B7280">Tổng được nhận</span><span style="font-weight:800;color:#10B981">'+vnd(pairIn(pair,p.id))+'</span></div>';
        }
      }
      out+='</div>';
    }
  }

  function sec(list,bg,clr,title,isDebtor){
    if(!list.length)return;
    out+='<div class="card"><div class="ct" style="color:'+clr+'">'+title+'</div>';
    list.forEach(function(p){personRow(p,isDebtor,bg,clr,isDebtor?pairOut(pair,p.id):pairIn(pair,p.id));});
    out+='</div>';
  }

  sec(debt,'#FEE2E2','#EF4444','🔴 Đang nợ',true);
  sec(cred,'#D1FAE5','#10B981','🟢 Đang được nhận',false);
  if(even.length){
    out+='<div class="card" style="padding:13px 16px"><div class="ct">⚪ Cân bằng</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
    even.forEach(function(p){out+='<span style="background:#F9FAFB;border:1.5px solid #E5E7EB;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;color:#6B7280">'+h(p.name)+'</span>';});
    out+='</div></div>';
  }
  return out;
}


// ── PAGE: THANH TOÁN ──────────────────
function pgPay(bal){
  var ppl=D.people;
  if(!ppl.length)return'<div style="text-align:center;padding:40px;color:#94A3B8"><div style="font-size:48px">👥</div><div style="font-weight:700;margin-top:8px">Chưa có thành viên</div></div>';
  var pAmt=parseFloat(SF.amt)||0;
  var ss=calcSettlements();
  var pair=calcPairwise();

  var out='<div class="card"><div class="ct">💸 Ghi nhận thanh toán</div>';
  out+='<div style="font-size:12px;color:#6B7280;background:#F9FAFB;border:1px solid #E5E7EB;border-radius:10px;padding:9px 11px;margin-bottom:10px">Thanh toán trừ trên công nợ sau cấn trừ chéo từng cặp. Ví dụ Phương nợ Dung nhiều hơn Dung nợ Phương thì app tự cấn trừ trước, phần còn lại mới cần thanh toán.</div>';
  out+='<div class="lbl">Ngày</div><input id="sf-d" class="inp" type="date" value="'+h(SF.date)+'" oninput="SF.date=this.value">';

  out+='<div class="lbl">Người trả nợ <span style="color:#EF4444;font-weight:500">(có công nợ trực tiếp)</span></div>';
  var debtIds={}; ss.forEach(function(x){debtIds[x.from]=true;});
  out+='<select id="sf-f" class="sel" onchange="setPayFrom(this.value)"><option value="">-- Ai trả nợ --</option>';
  ppl.forEach(function(p){
    if(debtIds[p.id]){
      out+='<option value="'+p.id+'"'+(p.id===SF.from?' selected':'')+'>'+h(p.name)+' — còn phải trả '+vnd(pairOut(pair,p.id))+'</option>';
    }
  });
  out+='</select>';

  out+='<div class="lbl">Người nhận tiền <span style="color:#10B981;font-weight:500">(đúng người được nhận của khoản đó)</span></div>';
  out+='<select id="sf-t" class="sel" onchange="setPayTo(this.value)"><option value="">-- Trả cho ai --</option>';
  var toIds={}; ss.forEach(function(x){if(!SF.from||x.from===SF.from)toIds[x.to]=true;});
  ppl.forEach(function(p){
    if(toIds[p.id]){
      var direct=SF.from?Math.round(((pair[SF.from]||{})[p.id])||0):pairIn(pair,p.id);
      out+='<option value="'+p.id+'"'+(p.id===SF.to?' selected':'')+'>'+h(p.name)+' — khoản này '+vnd(direct)+'</option>';
    }
  });
  out+='</select>';

  var maxDirect=0;
  if(SF.from&&SF.to)maxDirect=Math.round(((pair[SF.from]||{})[SF.to])||0);

  out+='<div class="lbl">Số tiền (₫)</div><input id="sf-a" class="inp" type="number" placeholder="Số tiền thanh toán" value="'+h(SF.amt)+'" oninput="SF.amt=this.value">';
  if(SF.from&&SF.to){
    out+='<div style="font-size:11.5px;color:#6B7280;margin-top:5px">Công nợ trực tiếp còn lại của cặp này: <b style="color:#7B2FBE">'+vnd(maxDirect)+'</b></div>';
  }
  out+='<div class="lbl">Ghi chú</div><input id="sf-n" class="inp" placeholder="VD: Chuyển khoản Momo, tiền mặt..." value="'+h(SF.note)+'" oninput="SF.note=this.value">';

  if(SF.from&&SF.to&&SF.from!==SF.to&&pAmt>0){
    var after=Math.max(0,maxDirect-pAmt);
    var warn=pAmt>maxDirect;
    out+='<div style="background:'+(warn?'#FEF2F2':'#F9FAFB')+';border:1.5px solid '+(warn?'#FCA5A5':'#E5E7EB')+';border-radius:12px;padding:13px;margin-top:12px">';
    out+='<div style="font-size:11px;font-weight:800;color:#6B7280;margin-bottom:10px;letter-spacing:.5px">👁️ CẶP CÔNG NỢ ĐƯỢC TRỪ</div>';
    out+='<div style="font-size:13px;font-weight:800">'+h(gn(SF.from))+' → '+h(gn(SF.to))+'</div>';
    out+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;margin-top:8px">';
    out+='<div style="background:white;border-radius:10px;padding:11px"><div style="color:#94A3B8">Trước</div><div style="font-weight:900;color:#EF4444">'+vnd(maxDirect)+'</div></div>';
    out+='<div style="background:white;border-radius:10px;padding:11px"><div style="color:#94A3B8">Sau</div><div style="font-weight:900;color:'+(after>0?'#EF4444':'#10B981')+'">'+vnd(after)+'</div></div>';
    out+='</div>';
    if(warn)out+='<div style="font-size:11.5px;color:#EF4444;font-weight:700;margin-top:8px">Số tiền nhập vượt công nợ trực tiếp. App sẽ không ghi nhận vượt.</div>';
    out+='</div>';
  }

  out+='<button onclick="saveSettle()" style="width:100%;margin-top:13px;padding:13px;background:#10B981;color:white;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.3)">✅ Xác nhận thanh toán</button></div>';
  if(D.settlements.length){
    out+='<div class="card"><div class="ct">📋 Thanh toán gần đây</div>';
    D.settlements.slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,5).forEach(function(s){
      out+='<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #F3F4F6"><div><div style="font-weight:700;font-size:13px">'+h(gn(s.from))+' → '+h(gn(s.to))+'</div><div style="font-size:11.5px;color:#94A3B8">'+(s.date?fd(s.date):'')+(s.note?' • '+h(s.note):'')+'</div></div>';
      out+='<div style="display:flex;align-items:center;gap:8px"><span style="font-weight:800;color:#10B981">'+vnd(s.amt)+'</span><span onclick="delSettle(\''+s.id+'\')" style="color:#EF4444;cursor:pointer;font-size:20px;line-height:1">×</span></div></div>';
    });
    out+='</div>';
  }
  return out;
}

// ── PAGE: LỊCH SỬ ─────────────────────
function pgHistory(){
  var out='<div style="display:flex;background:white;border-radius:12px;overflow:hidden;margin-bottom:11px;box-shadow:0 1px 3px rgba(123,47,190,.04),0 4px 16px rgba(123,47,190,.06)">';
  out+='<button onclick="setHTab(\'bills\')" style="flex:1;padding:11px;border:none;background:'+(HTAB==='bills'?'#7B2FBE':'transparent')+';color:'+(HTAB==='bills'?'white':'#94A3B8')+';font-size:12.5px;font-weight:800;cursor:pointer">🍽️ Hóa đơn ('+D.bills.length+')</button>';
  out+='<button onclick="setHTab(\'pays\')" style="flex:1;padding:11px;border:none;background:'+(HTAB==='pays'?'#7B2FBE':'transparent')+';color:'+(HTAB==='pays'?'white':'#94A3B8')+';font-size:12.5px;font-weight:800;cursor:pointer">💸 Thanh toán ('+D.settlements.length+')</button>';
  out+='</div>';
  if(HTAB==='bills'){
    var bills=D.bills.slice().sort(function(a,b){return b.ts-a.ts;});
    if(!bills.length)return out+'<div style="text-align:center;padding:40px;color:#94A3B8"><div style="font-size:48px">🍽️</div><div style="font-weight:700;margin-top:8px">Chưa có hóa đơn</div></div>';
    bills.forEach(function(b){
      out+='<div class="card">';
      out+='<div style="display:flex;justify-content:space-between;align-items:flex-start">';
      out+='<div style="flex:1"><div style="font-weight:800;font-size:14px">🍽️ '+h(b.desc)+'</div><div style="font-size:11.5px;color:#94A3B8;margin-top:3px">'+(b.date?fd(b.date):'')+'</div>';
      if(b.items&&b.items.length){
        out+='<div style="margin-top:7px">';
        b.items.forEach(function(x){out+='<div style="font-size:11.5px;color:#6B7280;line-height:1.6">'+h(x.name||'Khoản chi')+': '+vnd(x.amt)+' <span style="color:#7B2FBE;font-weight:700">('+h(gn(x.payer))+')</span></div>';});
        out+='</div>';
      }
      out+='</div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:10px"><span style="font-weight:900;color:#7B2FBE;font-size:15px">'+vnd(b.total)+'</span><span onclick="delBill(\''+b.id+'\')" style="color:#EF4444;cursor:pointer;font-size:20px;line-height:1">×</span></div></div>';
      out+='<div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:4px">';
      b.parts.forEach(function(p){var net=(p.paid||0)-(p.share||0);out+='<span style="font-size:11px;padding:3px 9px;border-radius:7px;font-weight:700;background:'+(net>0.5?'#D1FAE5':net<-0.5?'#FEE2E2':'#F3F4F6')+';color:'+(net>0.5?'#10B981':net<-0.5?'#EF4444':'#6B7280')+'">'+h(gn(p.id))+': '+(net>0.5?'+'+vnd(net):net<-0.5?'-'+vnd(-net):'OK')+'</span>';});
      out+='</div></div>';
    });
  } else {
    var pays=D.settlements.slice().sort(function(a,b){return b.ts-a.ts;});
    if(!pays.length)return out+'<div style="text-align:center;padding:40px;color:#94A3B8"><div style="font-size:48px">💸</div><div style="font-weight:700;margin-top:8px">Chưa có thanh toán</div></div>';
    pays.forEach(function(s){
      out+='<div style="background:#ECFDF5;border-radius:14px;padding:13px 15px;margin-bottom:10px;border:1.5px solid #A7F3D0;display:flex;justify-content:space-between;align-items:center">';
      out+='<div><div style="font-weight:800;font-size:13.5px;color:#10B981">💸 '+h(gn(s.from))+' → '+h(gn(s.to))+'</div><div style="font-size:11.5px;color:#6B7280;margin-top:2px">'+(s.date?fd(s.date):'')+(s.note?' • '+h(s.note):'')+'</div></div>';
      out+='<div style="display:flex;align-items:center;gap:8px"><span style="font-weight:900;color:#10B981">'+vnd(s.amt)+'</span><span onclick="delSettle(\''+s.id+'\')" style="color:#EF4444;cursor:pointer;font-size:20px;line-height:1">×</span></div></div>';
    });
  }
  if(D.bills.length||D.settlements.length)out+='<button onclick="clearAll()" style="width:100%;padding:12px;background:#FEE2E2;color:#EF4444;border:1.5px solid #FCA5A5;border-radius:12px;font-weight:700;cursor:pointer;margin-top:4px">🗑️ Xóa toàn bộ</button>';
  return out;
}

// ── Main render ───────────────────────
function render(){
  var bal=calcBal();
  var hd=calcSettlements().length>0;
  var ct='';
  if(TAB==='group')ct=pgGroup(bal);
  else if(TAB==='bill')ct=pgBill(bal);
  else if(TAB==='debt')ct=pgDebt(bal);
  else if(TAB==='pay')ct=pgPay(bal);
  else ct=pgHistory();
  var tabs=[['group','👥','Nhóm'],['bill','🧾','Hóa đơn'],['debt','📊','Công nợ'],['pay','💸','Trả nợ'],['history','📋','Lịch sử']];
  var bar='';
  tabs.forEach(function(t){var on=TAB===t[0];bar+='<button onclick="setTab(\''+t[0]+'\')" style="flex:1;padding:11px 1px;border:none;background:'+(on?'linear-gradient(135deg,#7B2FBE,#9F4FE0)':'transparent')+';color:'+(on?'white':'#94A3B8')+';font-size:9px;font-weight:800;cursor:pointer;line-height:1.6;transition:all .15s"><div style="font-size:15px">'+t[1]+'</div><div>'+t[2]+'</div></button>';});
  document.getElementById('root').innerHTML=
    '<div style="max-width:480px;margin:0 auto;min-height:100vh;background:#FAFAFC">'+
    '<div style="background:linear-gradient(135deg,#7B2FBE 0%,#9F4FE0 100%);color:white;padding:18px 16px 56px;position:relative;overflow:hidden">'+
      '<div style="position:absolute;top:-50px;right:-30px;width:180px;height:180px;background:rgba(255,255,255,.08);border-radius:50%"></div>'+
      '<div style="position:absolute;bottom:30px;left:-40px;width:120px;height:120px;background:rgba(255,255,255,.06);border-radius:50%"></div>'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1">'+
        '<div><div style="font-size:22px;font-weight:900;letter-spacing:-.3px">💸 Chia Tiền</div>'+
        '<div style="font-size:11.5px;opacity:.8;margin-top:2px;font-weight:500">Cấn trừ chéo • Tự lưu trong trình duyệt</div></div>'+
        '<div style="display:flex;gap:6px">'+
          '<button onclick="fbShowSetup()" title="Cấu hình Firebase" style="background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 9px;color:white;font-size:11px;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)">🔥</button>'+
          '<button onclick="downloadFile()" title="Tải bản backup" style="background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 9px;color:white;font-size:11px;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)">⬇️</button>'+
          '<button onclick="shareFile()" title="Chia sẻ file" style="background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;padding:7px 9px;color:white;font-size:11px;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)">📤</button>'+
        '</div>'+
      '</div>'+
      (hd?'<div style="margin-top:11px;background:rgba(255,255,255,.18);border-radius:10px;padding:6px 13px;font-size:12px;display:inline-block;position:relative;z-index:1;backdrop-filter:blur(8px)">⚠️ Còn công nợ chưa thanh toán</div>':'')+
    '</div>'+
    '<div style="margin:0 10px;margin-top:-32px;background:white;border-radius:16px;display:flex;box-shadow:0 8px 28px rgba(123,47,190,.18);overflow:hidden;position:relative;z-index:2">'+bar+'</div>'+
    '<div style="padding:12px 10px 100px">'+ct+'</div>'+
    '</div>';
  if(TAB==='bill')liveUpdate();
}

// ── Init ──────────────────────────────
loadInit();
loadDraft();
if(!BF.items||!BF.items.length)initBF();
initSF();
render();

// Boot Firebase
(function(){
  var saved=fbGetSavedConfig();
  if(saved&&saved.databaseURL){fbInit(saved);return;}
  setTimeout(function(){document.getElementById('fb-setup').style.display='flex';},600);
})();

</script>


</body></html>
